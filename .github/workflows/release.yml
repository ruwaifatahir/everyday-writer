# Push a `v*` tag to build the NSIS installer and attach it to a draft GitHub Release.
# Steps for cutting a release are in CONTRIBUTING.md.
name: Release

on:
  push:
    tags: ["v*"]

# Nothing by default; each job asks for what it needs.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: tag matches app version
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare tag with manifest versions
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$conf" != "$tag" ] || [ "$pkg" != "$tag" ] || [ "$cargo" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the app version in every manifest. Bump the manifests or fix the tag."
            exit 1
          fi

  release:
    name: build and draft release
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write # create the draft release and upload the installer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from package.json "packageManager". Must run before setup-node's pnpm cache.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Installs the toolchain pinned in rust-toolchain.toml. Before rust-cache: its key includes rustc's version.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"

      # Bundle targets come from tauri.conf.json (NSIS only). No updater or code signing yet.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: "Draft release. Download the installer from the assets below."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: false
